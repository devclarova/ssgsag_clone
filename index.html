<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>슥삭 | 대학생 대외활동·공모전·인턴·교육 추천 공고</title>

    <!-- 파비콘 삽입 -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- CSS 및 JS 연결 -->
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/header.css" />
    <script src="js/header.js"></script>

    <link rel="stylesheet" href="css/banner.css" />
    <script src="js/banner.js"></script>

    <link rel="stylesheet" href="css/icon.css" />
    <script src="js/icon.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div class="layout">
        <!-- 헤더 부분 -->
        <header>
          <ul class="header_left">
            <li class="logo">
              <img src="images/img_logo_ssgsag.svg" alt="ssgsag" />
            </li>
            <li class="myplan">내 일정</li>
            <li class="recommend">추천공고</li>
            <li class="superintern">슈퍼인턴</li>
          </ul>
          <ul class="header_right">
            <li class="upload">
              <img src="images/ic_upload.svg" alt="공고등록" />
              공고등록
            </li>
            <li class="advertise">
              <img src="images/ic_advertise.svg" alt="광고문의" />
              광고문의
            </li>
            <li class="login">로그인</li>
          </ul>
        </header>
      </div>

      <!-- 배너 부분 -->
      <div class="banner">
        <div class="banner_wrap">
          <!-- Swiper -->
          <div class="swiper banner_info">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <img
                  src="https://storage.googleapis.com/ssgsag/contents/7a6c6625-b9f9-4818-9f74-6051b4266768.png"
                  alt="앱으로 확인하기"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="https://storage.googleapis.com/ssgsag/contents/888bf59e-5ee2-451c-a9e9-678c863531ac.png"
                  alt="새로운 홈"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="https://storage.googleapis.com/ssgsag/contents/b11a66d0-c376-4505-8b82-4b2667123ecb.png"
                  alt="대외활동"
                />
              </div>
              <div class="swiper-slide">
                <img
                  src="https://storage.googleapis.com/ssgsag/contents/283d0b23-2c18-4bcd-8178-7fa783838d99.png"
                  alt="슈퍼인턴"
                />
              </div>
            </div>
            <button class="banner_prev">
              <img src="images/slider_arrow.svg" alt="이전" />
            </button>
            <button class="banner_next">
              <img src="images/slider_arrow.svg" alt="다음" />
            </button>
          </div>
        </div>
        <div class="swiper-pagination"></div>
      </div>

      <!-- 아이콘 링크 -->
      <div class="icon_link">
        <ul>
          <li class="icon_list">
            <div class="icon_img">
              <img src="images/ic_activity.png" alt="대외활동" />
            </div>
            <button class="icon_button">
              <p>대외활동</p>
            </button>
          </li>
          <li class="icon_list">
            <div class="icon_img">
              <img src="images/ic_contest.png" alt="공모전" />
            </div>
            <button class="icon_button">
              <p>공모전</p>
            </button>
          </li>
          <li class="icon_list">
            <div class="icon_img">
              <img src="images/ic_internship.png" alt="인턴십" />
            </div>
            <button class="icon_button">
              <p>인턴십</p>
            </button>
          </li>
          <li class="icon_list">
            <div class="icon_img">
              <img src="images/ic_education.png" alt="교육강연" />
            </div>
            <button class="icon_button">
              <p>교육강연</p>
            </button>
          </li>
        </ul>
      </div>

      <!-- 콕 공고 -->
      <div class="cok_notice"></div>

      <!-- 핫한 공고 -->
      <div class="hot_notice"></div>

      <!-- 게시된 공고 -->
      <div class="already_notice"></div>

      <!-- 앱설치 안내 -->
      <div class="install_info"></div>

      <!-- footer -->
      <div class="footer"></div>
    </div>
  </body>
</html>
